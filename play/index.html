<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="返し">
<meta name="theme-color" content="#0a0f1c">
<style>html { -webkit-text-size-adjust: 100%; } body { margin: 0; }</style>
</head>
<body>
<title>返し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
  /* 一枚の画面：上に相手、下に親指。雪の夜に、月の冷たさと灯籠の温かさ。 */
  :root {
    --night: #0a0f1c;
    --ink: #e8ecf3;
    --mist: #9aa6ba;
    --lantern: #ffb36b;
    --steel: #dfe7f2;
    --ember: #c8303c;
    --veil: rgba(10, 15, 28, 0.8);
    --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  #glyphs { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .glyph {
    position: absolute;
    transform: translate(-50%, -50%);
    font-family: var(--display);
    font-weight: 700;
    color: var(--steel);
    text-shadow: 0 0 18px rgba(223, 231, 242, 0.55);
    animation: glyph 640ms ease-out forwards;
    white-space: nowrap;
  }
  .glyph.go { font-size: 26px; opacity: 0.8; }
  .glyph.tai { font-size: 40px; }
  .glyph.sen { font-size: 56px; color: #fff4e6; text-shadow: 0 0 26px rgba(255, 179, 107, 0.75); }
  .glyph.miss { font-size: 22px; color: var(--mist); text-shadow: none; }
  .glyph.cut { font-size: 30px; color: #ffe2c4; text-shadow: 0 0 16px rgba(255, 120, 80, 0.6); }
  .glyph.chain { font-size: 15px; letter-spacing: 0.2em; color: var(--lantern); text-shadow: 0 0 12px rgba(255, 179, 107, 0.6); animation-duration: 900ms; }
  .glyph.phase { font-size: 34vmin; font-weight: 800; color: rgba(232, 236, 243, 0.9); text-shadow: 0 0 40px rgba(200, 48, 60, 0.55); animation: phase 1900ms ease-out forwards; }
  @keyframes glyph {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(0.85); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -95%) scale(1.04); }
  }
  @keyframes phase {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(1.25); filter: blur(8px); }
    25% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.96); filter: blur(2px); }
  }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.55) 100%); }
  #slash {
    position: fixed; left: 50%; top: 42%;
    width: 160vmax; height: 3px;
    background: linear-gradient(90deg, transparent, #fff 30%, #fff 70%, transparent);
    transform: translate(-50%, -50%) rotate(-28deg) scaleX(0);
    opacity: 0; pointer-events: none;
    box-shadow: 0 0 26px rgba(255, 255, 255, 0.95);
  }
  #slash.on { animation: slash 1000ms cubic-bezier(.2, .9, .2, 1) forwards; }
  @keyframes slash {
    0% { opacity: 1; transform: translate(-50%, -50%) rotate(-28deg) scaleX(0); }
    20% { opacity: 1; transform: translate(-50%, -50%) rotate(-28deg) scaleX(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) rotate(-28deg) scaleX(1); }
  }

  #logBtn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    font-family: var(--body); font-size: 12px; letter-spacing: 0.08em;
    color: var(--mist); background: transparent;
    border: 1px solid rgba(154, 166, 186, 0.35); border-radius: 999px;
    padding: 6px 12px; cursor: pointer;
  }
  #logBtn:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
  #log {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 48px);
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    width: min(310px, calc(100vw - 24px));
    background: var(--veil);
    border: 1px solid rgba(154, 166, 186, 0.25);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px; line-height: 1.6;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  #log .meta { color: var(--mist); margin-bottom: 6px; }
  #log .row { display: grid; grid-template-columns: 3.8em 4.6em 1fr; gap: 6px; }
  #log .row .t { font-family: var(--display); font-weight: 700; }

  .veil {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: var(--veil);
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-y: auto;
  }
  .card { max-width: 30em; display: grid; gap: 14px; text-align: left; }
  .card h1 {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(56px, 18vw, 96px); line-height: 1;
    margin: 0; letter-spacing: 0.06em;
  }
  .card .kicker { font-size: 11px; letter-spacing: 0.24em; color: var(--mist); text-transform: uppercase; margin: 0; }
  .card p { margin: 0; font-size: 15px; line-height: 1.75; color: var(--ink); }
  .card .note { font-size: 13px; color: var(--mist); }
  .card details { font-size: 13px; color: var(--mist); line-height: 1.7; }
  .card summary { cursor: pointer; color: var(--ink); }
  .card dl { display: grid; grid-template-columns: 5em 1fr; gap: 4px 10px; margin: 10px 0 0; }
  .card dt { font-family: var(--display); font-weight: 700; color: var(--ink); }
  .card dd { margin: 0; }
  .card button {
    justify-self: start;
    font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: 0.2em;
    color: var(--night); background: var(--steel);
    border: 0; border-radius: 999px; padding: 12px 28px; cursor: pointer;
  }
  .card button:focus-visible { outline: 2px solid var(--lantern); outline-offset: 3px; }
  .end h2 { font-family: var(--display); font-size: clamp(40px, 12vw, 64px); margin: 0; letter-spacing: 0.1em; }
  .cross { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, auto); gap: 6px; max-width: 18em; }
  .cross .k { display: grid; justify-items: center; gap: 2px; padding: 8px 4px; border: 1px solid rgba(154, 166, 186, 0.3); border-radius: 10px; font-size: 13px; color: var(--mist); }
  .cross .k b { font-family: var(--display); font-size: 20px; color: var(--ink); }
  .cross .up { grid-column: 2; grid-row: 1; }
  .cross .left { grid-column: 1; grid-row: 2; }
  .cross .mid { grid-column: 2; grid-row: 2; border: 0; align-content: center; }
  .cross .right { grid-column: 3; grid-row: 2; }
  .cross .down { grid-column: 2; grid-row: 3; }
  #hint {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    display: flex; gap: 18px; pointer-events: none; white-space: nowrap;
    font-size: 13px; color: var(--mist); letter-spacing: 0.06em;
    transition: opacity 1.2s ease;
  }
  #hint b { font-family: var(--display); color: var(--ink); margin-right: 6px; font-size: 16px; }
  #hint.fade { opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    .glyph, .glyph.phase { animation-duration: 1ms; }
    #slash.on { animation-duration: 1ms; }
  }
</style>

<div id="stage" aria-label="対戦の画面"></div>
<div id="vignette"></div>
<div id="glyphs"></div>
<div id="flash"></div>
<div id="slash"></div>
<button id="logBtn" type="button" aria-pressed="false">記録</button>
<div id="log" hidden></div>

<div id="start" class="veil">
  <div class="card">
    <p class="kicker">Kaeshi · 試作 0.4</p>
    <h1>返し</h1>
    <p>画面のどこでも、四つの向きにはじく。</p>
    <div class="cross" aria-label="操作">
      <div class="k up"><b>上</b><span>斬る</span></div>
      <div class="k left"><b>左</b><span>避ける</span></div>
      <div class="k mid">はじく</div>
      <div class="k right"><b>右</b><span>避ける</span></div>
      <div class="k down"><b>下</b><span>弾く</span></div>
    </div>
    <dl>
      <dt>弾き</dt><dd>刃が届く直前に下。早いと「受け」になる。</dd>
      <dt>見切り</dt><dd>刃が届く直前に左右。時間がゆっくりになる。</dd>
      <dt>反撃</dt><dd>弾き・見切りの直後に上。跳び込んで大きく斬る。</dd>
      <dt>赤い刃</dt><dd>弾けない。左右で避ける。突きなら直前に上で踏みつける。</dd>
      <dt>一閃</dt><dd>相手が膝をついたら上。</dd>
    </dl>
    <p class="note">相手が動き出した瞬間に上で斬れば、出鼻を挫ける。隙のない相手に斬りかかると弾かれ、反撃される。PCでは矢印キーでも遊べます。音が出ます。</p>
    <button id="startBtn" type="button">はじめる</button>
  </div>
</div>

<div id="hint" hidden><span><b>上</b>斬る</span><span><b>下</b>弾く</span><span><b>左右</b>避ける</span></div>

<div id="end" class="veil" hidden>
  <div class="card end">
    <h2 id="endTitle">勝負あり</h2>
    <p id="endText" class="note"></p>
    <button id="againBtn" type="button">もう一度</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';

  // ───────────────────────── 調整値 ─────────────────────────
  const CFG = {
    perfectGuard: 160,      // 下を入れてから、この時間内に刃が届けば「弾き」
    spamGuard: 70,          // 連打すると弾きの時間が短くなる
    spamGap: 380,
    guardWin: 450,          // それ以降は「受け」
    perfectDodge: 180,      // 左右を入れてから、この時間内に刃が届けば「見切り」
    dodgeWin: 320,
    stompWin: 300,          // 危険な突きに、上で踏み込める時間
    lateGrace: 55,          // 刃が届いた後の入力も、少しだけ認める
    counterParry: 950, counterMikiri: 1300,
    brk: { parry: 11, block: 2, counter: 17, counterMikiri: 21, debana: 16, stomp: 25, cut: 4, cutOpen: 5, cutHeavy: 8, deflected: 1, windupHit: 2 },
    enemyRecoverDelay: 2100, enemyRecoverRate: 9,
    openHits: 3,             // 一つの隙で入る斬りの数。それ以上は相手が抜け出す
    playerRecoverDelay: 1700, playerRecoverRate: 6,
    brokenTime: 2300,
    hitDamage: (w) => 22 + 13 * w,
    blockDamage: (w) => 7 * w,
    reachPlayer: 2.95,
    minGap: 1.35,
    arena: 7.5,
  };
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const easeIn = (t) => Math.pow(clamp(t, 0, 1), 2.4);
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ───────────────────────── 技 ─────────────────────────
  const MOVES = {
    cutR:   { key: 'R', w: 1.0, reach: 2.9, lunge: 0.5, name: '右薙ぎ' },
    cutL:   { key: 'L', w: 1.0, reach: 2.9, lunge: 0.5, name: '左薙ぎ' },
    over:   { key: 'D', w: 1.6, reach: 3.0, lunge: 0.6, name: '振り下ろし' },
    rise:   { key: 'U', w: 1.1, reach: 2.85, lunge: 0.45, name: '斬り上げ' },
    thrust: { key: 'T', w: 1.2, reach: 3.2, lunge: 0.8, name: '突き' },
    quickR: { key: 'R', w: 0.6, reach: 2.8, lunge: 0.35, name: '小薙ぎ' },
    quickL: { key: 'L', w: 0.6, reach: 2.8, lunge: 0.35, name: '小薙ぎ' },
    dash:   { key: 'T', w: 1.3, reach: 3.2, lunge: 0, dash: true, name: '突進突き' },
    sweep:  { key: 'S', w: 1.4, reach: 3.0, lunge: 0.45, peril: 'sweep', name: '危：薙ぎ払い' },
    pierce: { key: 'T', w: 1.5, reach: 3.4, lunge: 0.95, peril: 'pierce', name: '危：突き' },
    counterR: { key: 'R', w: 0.75, reach: 2.9, lunge: 0.5, fast: true, name: '反撃' },
    counterL: { key: 'L', w: 0.75, reach: 2.9, lunge: 0.5, fast: true, name: '反撃' },
  };

  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const pose = (o) => Object.assign({ hipX: 0, hipZ: 0, crouch: 0.05, pitch: 0, yaw: 0, roll: 0, lift: 0 }, o);
  const mirrorX = (p) => pose({ hand: V(-p.hand.x, p.hand.y, p.hand.z), sword: V(-p.sword.x, p.sword.y, p.sword.z), hipX: -p.hipX, hipZ: p.hipZ, crouch: p.crouch, pitch: p.pitch, yaw: -p.yaw, roll: -p.roll, lift: p.lift });
  const N = (x, y, z) => V(x, y, z).normalize();

  // 相手の姿勢（ローカル：前＝+z。相手はこちらを向いているので x は画面の右）。実際より大きく、激しく。
  const NEUTRAL = pose({ hand: V(0.05, 1.18, 0.44), sword: N(0, 0.42, 1), crouch: 0.15, pitch: 0.06 });
  const KEY = {
    R: {
      wind: pose({ hand: V(-0.68, 1.72, -0.05), sword: N(-0.7, 0.55, -0.45), hipX: -0.18, crouch: 0.26, yaw: 1.25, roll: 0.1, pitch: -0.08 }),
      hit:  pose({ hand: V(0.05, 1.28, 0.86), sword: N(1, 0.04, 0.32), hipX: 0.05, crouch: 0.24, yaw: -0.35, pitch: 0.16 }),
      follow: pose({ hand: V(0.72, 0.98, 0.3), sword: N(0.74, -0.38, -0.55), hipX: 0.22, crouch: 0.26, yaw: -1.35, pitch: 0.2, roll: -0.08 }),
    },
    D: {
      wind: pose({ hand: V(0.02, 2.2, -0.18), sword: N(0, 0.45, -0.9), hipZ: -0.2, crouch: 0.08, pitch: -0.45, lift: 0.12 }),
      hit:  pose({ hand: V(0.02, 1.36, 0.82), sword: N(0, -0.3, 1), hipZ: 0.1, crouch: 0.28, pitch: 0.32 }),
      follow: pose({ hand: V(0.02, 0.8, 0.7), sword: N(0, -0.9, 0.42), hipZ: 0.22, crouch: 0.4, pitch: 0.6 }),
    },
    U: {
      wind: pose({ hand: V(0.12, 0.7, 0.1), sword: N(0.15, -0.75, -0.5), hipZ: -0.08, crouch: 0.34, pitch: 0.3 }),
      hit:  pose({ hand: V(0.02, 1.3, 0.8), sword: N(0, 0.42, 1), crouch: 0.14 }),
      follow: pose({ hand: V(-0.06, 2.05, 0.28), sword: N(0, 0.95, -0.25), crouch: 0.02, pitch: -0.28, lift: 0.1 }),
    },
    T: {
      wind: pose({ hand: V(0.2, 1.26, -0.42), sword: N(0, 0.05, 1), hipZ: -0.3, crouch: 0.3, yaw: 0.6, pitch: -0.08 }),
      hit:  pose({ hand: V(0.02, 1.28, 1.25), sword: N(0, 0.02, 1), hipZ: 0.4, crouch: 0.26, yaw: -0.12, pitch: 0.24 }),
      follow: pose({ hand: V(0.02, 1.22, 1.1), sword: N(0, 0.0, 1), hipZ: 0.36, crouch: 0.26, pitch: 0.22 }),
    },
    S: {
      wind: pose({ hand: V(0.7, 0.72, -0.08), sword: N(0.8, -0.42, -0.45), hipX: 0.16, crouch: 0.42, yaw: -1.2, pitch: 0.24 }),
      hit:  pose({ hand: V(0.02, 0.55, 0.9), sword: N(-1, -0.2, 0.3), crouch: 0.46, pitch: 0.3 }),
      follow: pose({ hand: V(-0.7, 0.66, 0.38), sword: N(-0.8, -0.3, -0.5), hipX: -0.16, crouch: 0.42, yaw: 1.2, pitch: 0.26 }),
    },
  };
  KEY.L = { wind: mirrorX(KEY.R.wind), hit: mirrorX(KEY.R.hit), follow: mirrorX(KEY.R.follow) };
  const KNEEL = pose({ hand: V(0.25, 0.7, 0.55), sword: N(0.3, -0.85, 0.4), crouch: 0.46, pitch: 0.55, hipZ: -0.05 });
  // 本物の隙：腰が伸び、力が抜けている。誘い：見た目は似ているが、腰が沈んで溜まっている。
  const OPEN = pose({ hand: V(0.32, 0.96, 0.32), sword: N(0.35, -0.62, 0.7), crouch: 0.0, hipZ: 0.03, pitch: 0.08 });
  const BAIT = pose({ hand: V(0.32, 0.96, 0.32), sword: N(0.35, -0.62, 0.7), crouch: 0.2, hipZ: -0.13, pitch: 0.08 });
  const GUARD = pose({ hand: V(0.05, 1.45, 0.52), sword: N(0.78, 0.62, 0.1), crouch: 0.16, yaw: -0.25 });

  // 自分の姿勢。画面の向き（右＝+x、前＝相手の方）で書き、自分は相手に背を向けているので左右を反転して使う。
  const PS = (o) => mirrorX(pose(o));
  const PL = {
    guard:   PS({ hand: V(0.14, 1.14, 0.42), sword: N(0.12, 0.8, 0.6), crouch: 0.18, pitch: 0.06 }),
    low:     PS({ hand: V(0.12, 1.0, 0.44), sword: N(0.15, 0.42, 0.9), crouch: 0.28, pitch: 0.14 }),
    windR:   PS({ hand: V(0.62, 1.72, -0.06), sword: N(0.62, 0.5, -0.6), yaw: 1.25, crouch: 0.24, pitch: -0.06, hipX: 0.1 }),
    hitL:    PS({ hand: V(-0.58, 1.1, 0.7), sword: N(-0.92, -0.14, 0.38), yaw: -1.3, crouch: 0.3, pitch: 0.24, hipZ: 0.14, hipX: -0.08 }),
    windL:   PS({ hand: V(-0.62, 1.72, -0.06), sword: N(-0.62, 0.5, -0.6), yaw: -1.25, crouch: 0.24, pitch: -0.06, hipX: -0.1 }),
    hitR:    PS({ hand: V(0.58, 1.1, 0.7), sword: N(0.92, -0.14, 0.38), yaw: 1.3, crouch: 0.3, pitch: 0.24, hipZ: 0.14, hipX: 0.08 }),
    windUp:  PS({ hand: V(0.05, 2.2, -0.22), sword: N(0.02, 0.48, -0.88), pitch: -0.45, crouch: 0.06, lift: 0.42 }),
    hitDown: PS({ hand: V(0.02, 0.9, 0.88), sword: N(0, -0.62, 0.78), pitch: 0.6, crouch: 0.44, hipZ: 0.16 }),
    coil:    PS({ hand: V(0.52, 0.7, -0.14), sword: N(0.5, -0.55, -0.67), crouch: 0.44, yaw: 1.1, pitch: 0.28 }),
    rise:    PS({ hand: V(-0.32, 2.1, 0.56), sword: N(-0.55, 0.78, 0.3), yaw: -1.35, lift: 0.62, pitch: -0.14, crouch: 0.05 }),
    riseEnd: PS({ hand: V(-0.48, 1.72, 0.2), sword: N(-0.8, 0.5, -0.32), yaw: -1.55, lift: 0.12, crouch: 0.22 }),
    deflect: PS({ hand: V(0.0, 1.4, 0.54), sword: N(0.9, 0.42, 0.1), crouch: 0.26, pitch: 0.05, yaw: -0.35 }),
    deflectSnap: PS({ hand: V(0.12, 1.55, 0.38), sword: N(0.66, 0.74, -0.12), crouch: 0.22, yaw: -0.1, pitch: -0.08 }),

      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
    }
    return {
      init,
      parry(tier, chain) {
        const k = Math.pow(2, PENTA[Math.min(chain, PENTA.length - 1)] / 12);
        if (tier === 'go') { bell(1240 * k * 0.8, 0.35, 0.22); noise(0.04, 'bandpass', 5200, 1.2, 0.18); }
        else if (tier === 'tai') { bell(980 * k * 0.8, 0.9, 0.3); bell(1960 * k * 0.8, 0.5, 0.08, [1, 2.4]); noise(0.06, 'bandpass', 4200, 1, 0.24); }
        else { bell(1480 * k * 0.8, 1.8, 0.32); bell(740 * k * 0.8, 1.2, 0.12, [1, 3.01]); noise(0.05, 'highpass', 6000, 0.7, 0.16); }
      },
      clash() { bell(420, 0.35, 0.2, [1, 1.93, 3.7]); noise(0.12, 'bandpass', 1800, 0.8, 0.26); },
      cut() { noise(0.18, 'bandpass', 2600, 0.9, 0.22, 900); tone(220, 90, 0.18, 0.12, 'triangle'); },
      hit() { tone(150, 42, 0.32, 0.55); noise(0.18, 'lowpass', 900, 0.7, 0.35); },
      whiff() { noise(0.16, 'bandpass', 700, 2, 0.12, 2400); },
      dodge() { noise(0.2, 'bandpass', 500, 1.2, 0.1, 1800); },
      crunch(strength) { noise(0.12 + strength * 0.05, 'bandpass', 1700, 1.4, 0.04 + strength * 0.06); },
      step(strength) { noise(0.07, 'bandpass', 2200, 1.6, 0.012 + strength * 0.02); },
      swing(w) { noise(0.12 + w * 0.06, 'bandpass', 500 + 400 / w, 1.5, 0.05 + 0.04 * w, 1400); },
      peril() { tone(70, 55, 0.9, 0.35, 'sawtooth'); bell(311, 0.8, 0.08, [1, 1.06]); },
      breath(strength) { noise(0.45, 'bandpass', 900, 0.8, 0.012 + strength * 0.03); },
      phase() { tone(55, 41, 2.2, 0.4, 'sawtooth'); bell(130, 2.5, 0.2, [1, 2.0, 3.0]); },
      issen() {
        if (!ctx) return;
        const t = now();
        if (wind) { wind.gain.cancelScheduledValues(t); wind.gain.setValueAtTime(0.0001, t); wind.gain.linearRampToValueAtTime(0.05, t + 3.5); }
        setTimeout(() => { bell(196, 3.6, 0.36, [1, 2.0, 3.0, 4.17]); bell(2350, 2.2, 0.06, [1, 1.5]); }, 260);
      },
    };
  })();

  // ───────────────────────── 状態 ─────────────────────────
  const S = {
    started: false, gt: 0, speed: 1,
    freezeUntil: 0, slowUntil: 0, slowScale: 0.3,
    frameReal: 0, frameGt: 0, frameScale: 1,
    phase: 1, mode: 'stalk', modeStart: 0, modeUntil: 0,
    B: 0, P: 0, lastPressure: 0, lastHit: -9999,
    action: null, queue: [],
    enemyPose: clonePose(NEUTRAL), actionFrom: clonePose(NEUTRAL),
    playerPose: clonePose(PL.guard), pa: null, comboStep: 0, lastSlashEnd: -9999, bufferU: false,
    guardStart: -1e9, guardPerfect: 160, lastGuard: -1e9, dodgeStart: -1e9, stompStart: -1e9,
    counterUntil: 0, counterKind: null, counterUsed: null, playerLockUntil: 0, enemyDeflects: 0, guardUntil: 0,
    stagger: { x: 0, vx: 0, p: 0, vp: 0 },
    e: { x: 0, z: -1.4, tw: null, vx: 0, vz: 0, yaw: 0 },
    p: { x: 0, z: 1.8, tw: null, yaw: Math.PI },
    stalkDir: 1, chain: 0, bestChain: 0,
    breathE: 0, breathP: 0, shake: 0, fovKick: 0, cine: null,
    habit: { guard: 0, attack: 0, dodge: 0 }, lastDodge: -9999,
    log: [], r: rng(1234), auto: false, touch: null,
    stats: { parry: 0, block: 0, mikiri: 0, counter: 0, debana: 0, stomp: 0, cut: 0, hits: 0, dodges: 0, start: 0 },
  };

  const dist = () => Math.hypot(S.e.x - S.p.x, S.e.z - S.p.z);
  function dirPE() { const dx = S.e.x - S.p.x, dz = S.e.z - S.p.z, d = Math.hypot(dx, dz) || 1; return { x: dx / d, z: dz / d, d }; }
  function tween(actor, tx, tz, dur, easing) { actor.tw = { fx: actor.x, fz: actor.z, tx, tz, t0: S.gt, dur, easing: easing || easeOut }; }

  function timing(move) {
    const k = S.phase === 2 ? 0.9 : 1, w = move.w;
    if (move.fast) return { O: 80, W: 140, S: 110, F: 230, R: 440 };
    if (move.dash) return { O: 230 * k, W: 380 * k, S: 300, F: 260, R: 520 };
    return { O: (150 + 150 * w) * k, W: (220 + 330 * w) * k, S: 115 + 75 * w, F: 220 + 150 * w, R: 380 + 300 * w };
  }

  const PATTERNS = {
    1: [['over'], ['cutR'], ['cutL'], ['cutL', 'cutR'], ['over', 'cutR'], ['rise'], ['cutR', 'cutL'], ['thrust'], ['sweep']],
    2: [['quickR', 'quickL', 'quickR'], ['thrust'], ['over*'], ['~', 'quickR'], ['~', 'over'], ['cutL', 'thrust'],
        ['rise', 'over*'], ['quickL', 'quickR', 'cutL'], ['~', 'thrust'], ['cutR', 'cutL', 'over'], ['sweep'], ['cutR', 'pierce'], ['quickL', 'sweep'], ['pierce']],
  };
  function pickPattern() {
    const list = PATTERNS[S.phase];
    // 相手はこちらの癖を学ぶ：下の連打が多いと、虚と溜めを増やす。避けてばかりだと、危険な技を増やす。
    const weights = list.map((p) => {
      const tricky = p.some((t) => t === '~' || t.endsWith('*'));
      const peril = p.some((t) => t === 'sweep' || t === 'pierce');
      return 1 + (tricky ? S.habit.guard * 0.6 : 0) + (peril ? S.habit.dodge * 0.35 : 0);
    });
    let r = S.r() * weights.reduce((a, b) => a + b, 0);
    for (let i = 0; i < list.length; i++) { r -= weights[i]; if (r <= 0) return list[i].slice(); }
    return list[0].slice();
  }
  function setMode(m, dur) {
    if (m === 'open' || m === 'bait' || (m === 'staggered' && S.mode !== 'staggered')) S.openHits = 0;
    S.mode = m; S.modeStart = S.gt; S.modeUntil = S.gt + (dur || 0);
    S.actionFrom = clonePose(S.enemyPose);
    if (m === 'stalk') S.stalkDir = S.r() < 0.5 ? -1 : 1;
  }
  function think() {
    const d = dist();
    if (S.queue.length) { startAction(S.queue.shift()); return; }
    Object.keys(S.habit).forEach((k) => { S.habit[k] *= 0.93; });
    const r = S.r();
    if (d > 3.8 && S.gt - S.lastDodge < 1500 && r < 0.6) { startAction('dash'); return; }
    if (d > 4.8) { if (r < 0.55) startAction('dash'); else setMode('approach', 4000); return; }
    if (d > 3.0) { if (r < 0.6) setMode('approach', 4000); else setMode('stalk', 700 + S.r() * 900); return; }
    if (r < 0.15) { setMode('stalk', 600 + S.r() * 700); return; }
    S.queue = pickPattern();
    startAction(S.queue.shift());
  }
  function startAction(token) {
    const feint = token === '~';
    const delayed = token.endsWith('*');
    const key = token.replace('*', '');
    const move = feint ? { key: ['R', 'L', 'D'][Math.floor(S.r() * 3)], w: 1.2, reach: 2.9, lunge: 0, name: '虚' } : MOVES[key];
    if (!move) { setMode('stalk', 600); return; }
    const tm = timing(move);
    const D = delayed ? 380 + S.r() * 380 : 0;
    const a = { move, feint, t0: S.gt, ...tm, D, resolved: false, parried: false, lunged: false, peril: move.peril || null };
    a.T = a.t0 + a.O + a.W + a.D + a.S;
    if (feint) a.end = a.t0 + a.O + 320;
    S.action = a;
    S.mode = 'attack'; S.modeStart = S.gt;
    S.actionFrom = clonePose(S.enemyPose);
    if (!feint) { Sound.crunch(move.w / 1.6); kickSnow(enemy.hipWorld, move.dash ? 1 : 0.35); }
    if (a.peril) Sound.peril();
  }

  // ───────────────────────── 操作 ─────────────────────────
  // 向きの意味はいつでも同じ。上＝斬る、下＝弾く、左右＝避ける。タイミングが変えるのは質だけ。
  function toGameTime(realT) { return S.frameGt + (realT - S.frameReal) * S.frameScale * S.speed; }

  function doInput(dir, tDown) {
    if (!S.started || !dir) return;
    if (['victory', 'defeat', 'falling'].includes(S.mode)) return;
    if (S.mode === 'broken') { issen(); return; }
    if (S.gt < S.playerLockUntil) return;
    const pa = S.pa, t = pa ? S.gt - pa.t0 : 1e9;
    const attacking = pa && pa.def.hitAt !== undefined && t < pa.def.dur;
    if (dir === 'U') {
      if (attacking) { if (t >= pa.def.cancel) upAction(tDown); else if (t >= 60) S.bufferU = true; return; }
      upAction(tDown);
      return;
    }
    // 下と左右は、斬りの振り終わりからなら割り込める
    if (attacking && t < 110) return;
    if (dir === 'D') {
      const spam = tDown - S.lastGuard < CFG.spamGap;
      S.guardPerfect = spam ? CFG.spamGuard : CFG.perfectGuard;
      S.lastGuard = S.guardStart = tDown;
      S.habit.guard += spam ? 1 : 0.2;
      startPA('deflect');
      return;
    }
    S.dodgeStart = tDown; S.lastDodge = S.gt; S.habit.dodge += 0.6;
    startPA('dodge', { side: dir === 'R' ? 1 : -1 });
  }

  function upAction(tDown) {
    const a = S.action;
    if (S.gt < S.counterUntil) { S.counterUsed = S.counterKind; S.counterUntil = 0; startPA('counter'); return; }
    if (a && !a.resolved && !a.feint && a.peril === 'pierce' && a.T - tDown >= -CFG.lateGrace && a.T - tDown <= CFG.stompWin) {
      S.stompStart = tDown; startPA('stomp'); return;
    }
    const debana = !!(a && !a.resolved && !a.feint && !a.peril && tDown - a.t0 >= 0 && tDown - a.t0 <= a.O);
    const intoFeint = !!(a && a.feint && tDown - a.t0 <= a.O + 120);
    const chaining = S.pa && S.pa.kind.startsWith('slash') || S.gt - S.lastSlashEnd < 280;
    const step = chaining ? (S.comboStep % 3) + 1 : 1;
    S.comboStep = step;
    S.habit.attack += 0.5;
    startPA('slash' + step, { debana, intoFeint });
  }

  function startPA(kind, opts) {
    const def = PA[kind];
    S.pa = Object.assign({ kind, def, t0: S.gt, from: clonePose(S.playerPose), hitDone: false }, opts || {});
    S.bufferU = false;
    const f = dirPE();
    if (def.lunge) {
      const go = Math.max(0, Math.min(def.lunge, f.d - CFG.minGap - 0.05));
      tween(S.p, S.p.x + f.x * go, S.p.z + f.z * go, def.hitAt + 40, easeOut);
    }
    if (kind === 'dodge') {
      const side = S.pa.side;
      const ang = Math.atan2(S.p.x - S.e.x, S.p.z - S.e.z) - side * 0.6;
      const r = Math.max(f.d + 0.25, 2.0);
      tween(S.p, S.e.x + Math.sin(ang) * r, S.e.z + Math.cos(ang) * r, 260);
      Sound.dodge(); kickSnow(player.hipWorld, 0.6);
    }
    if (kind === 'stomp') { tween(S.p, S.p.x + f.x * Math.min(0.6, f.d - CFG.minGap), S.p.z + f.z * Math.min(0.6, f.d - CFG.minGap), 200); Sound.swing(1.0); }
    if (kind === 'counter') { Sound.swing(1.5); S.fovKick = 6; kickSnow(player.hipWorld, 0.9); }
    if (kind.startsWith('slash')) Sound.swing(def.heavy ? 1.3 : 0.9);
  }

  function updatePlayerAction() {
    const pa = S.pa;
    if (!pa) return;
    const t = S.gt - pa.t0;
    if (pa.def.hitAt !== undefined && !pa.hitDone && t >= pa.def.hitAt) { pa.hitDone = true; resolvePlayerHit(pa); }
    if (S.pa !== pa) return;
    if (S.bufferU && pa.def.cancel && t >= pa.def.cancel) { S.bufferU = false; upAction(S.gt); return; }
    if (t >= pa.def.dur) { if (pa.kind.startsWith('slash')) S.lastSlashEnd = S.gt; S.pa = null; }
  }

  // ───────────────────────── こちらの斬り ─────────────────────────
  function resolvePlayerHit(pa) {
    const d = dist();
    tA.copy(enemy.chestWorld).lerp(player.tip, 0.45);
    if (d > CFG.reachPlayer) { Sound.whiff(); return; }
    const m = S.mode, a = S.action;
    if (m === 'broken') { issen(); return; }
    if (pa.kind === 'counter') {
      S.queue = []; S.action = null;
      const mik = S.counterUsed === 'mikiri';
      S.stats.counter++;
      landHit(mik ? CFG.brk.counterMikiri : CFG.brk.counter, '反撃', 'cut', true);
      if (S.mode !== 'broken') setMode('staggered', 950);
      return;
    }
    if (pa.debana && a && !a.resolved && !a.feint) {
      a.resolved = true; S.action = null; S.queue = [];
      S.stats.debana++;
      S.slowUntil = performance.now() + 300;
      landHit(CFG.brk.debana, '出鼻', 'sen', true);
      if (S.mode !== 'broken') setMode('staggered', 850);
      return;
    }
    if (pa.intoFeint || m === 'bait') { pushLog(m === 'bait' ? '誘い' : '虚', '', m === 'bait' ? '誘いに乗った' : '虚に斬りかかった'); enemyDeflect(true); return; }
    const opening = m === 'open' || m === 'staggered' || m === 'retreat' || (m === 'attack' && a && a.resolved);
    if (opening) {
      const amt = pa.def.heavy ? CFG.brk.cutHeavy : (m === 'open' ? CFG.brk.cutOpen : CFG.brk.cut);
      S.openHits = (S.openHits || 0) + 1;
      landHit(amt, '斬', 'cut', pa.def.heavy);
      if (S.mode === 'broken') return;
      // 隙に斬り続けられるのは数太刀まで。相手は抜け出して間合いを取り直す。
      if (S.openHits >= CFG.openHits) { S.openHits = 0; S.guardUntil = S.gt + 240; setMode('retreatStart', 0); }
      else if (m === 'open' && pa.def.heavy) setMode('staggered', 500);
      return;
    }
    if (m === 'attack' && a && !a.resolved) {
      // 振りかぶっている相手は斬れるが、勢いは止まらない
      S.B = clamp(S.B + CFG.brk.windupHit, 0, 100); S.lastPressure = S.gt;
      Sound.cut(); burst(tA, 8, 1.0, 'red');
      glyphAt('浅', 'miss', tA);
      pushLog('浅い', '', '振りかぶった相手を斬った（止まらない）');
      return;
    }
    enemyDeflect(false);
  }

  function landHit(amount, label, cls, big) {
    S.B = clamp(S.B + amount, 0, 100); S.lastPressure = S.gt;
    if (label === '斬') S.stats.cut++;
    S.enemyDeflects = 0;
    addChain();
    Sound.cut(); if (big) Sound.parry('tai', S.chain);
    burst(tA, big ? 40 : 18, big ? 2.6 : 1.6, 'red');
    lightAt(tA, big ? 4.5 : 2.5, 0xffb08a);
    S.freezeUntil = performance.now() + (big ? 110 : 55);
    glyphAt(label, cls, tA);
    S.stagger.vp += -0.9 * (big ? 1.7 : 1);
    const f = dirPE();
    tween(S.e, S.e.x + f.x * (big ? 0.8 : 0.3), S.e.z + f.z * (big ? 0.8 : 0.3), big ? 320 : 200);
    if (big) { ring(S.e.x, S.e.z, 3.2, 0xffb08a); S.fovKick = Math.max(S.fovKick, 6); S.shake = Math.max(S.shake, 0.07); flash(0.18); }
    pushLog(label, '', `崩し ${Math.round(amount)}`);
    if (S.B >= 100) breakEnemy();
  }

  function enemyDeflect(forceCounter) {
    Sound.clash(); burst(tA, 14, 1.6, 'cool'); lightAt(tA, 2.2);
    S.guardUntil = S.gt + 260;
    S.B = clamp(S.B + CFG.brk.deflected, 0, 100);
    S.P = clamp(S.P + 3, 0, 100); S.lastHit = S.gt;
    S.enemyDeflects++;
    glyphAt('弾', 'miss', tA);
    pushLog('弾かれた', '', '隙のない相手に斬りかかった');
    S.shake = Math.max(S.shake, 0.04);
    if (forceCounter || S.enemyDeflects >= 2 || S.r() < 0.3) {
      S.enemyDeflects = 0; S.queue = [];
      setTimeout(() => { if (!['broken', 'falling', 'victory', 'defeat'].includes(S.mode)) startAction(S.r() < 0.5 ? 'counterR' : 'counterL'); }, 0);
    }
  }

  // ───────────────────────── 相手の刃が届いた瞬間 ─────────────────────────
  function judgeImpact(a) {
    const gt = S.gt;
    // 指は置かれたが、向きがまだ決まっていない：少しだけ待つ
    if (S.touch && !S.touch.resolved && a.T - S.touch.tDown < 200 && gt < a.T + 140) return null;
    const g = a.T - S.guardStart, v = a.T - S.dodgeStart, st = a.T - S.stompStart;
    if (a.peril === 'pierce' && st >= -CFG.lateGrace && st <= CFG.stompWin) return 'stomp';
    if (v >= -CFG.lateGrace && v <= CFG.dodgeWin) return v <= CFG.perfectDodge ? 'mikiri' : 'dodge';
    if (g >= -CFG.lateGrace && g <= CFG.guardWin) return a.peril ? 'guardBreak' : (g <= S.guardPerfect ? 'parry' : 'block');
    if (gt < a.T + CFG.lateGrace) return null;
    return dist() > a.move.reach + 0.15 ? 'miss' : 'hit';
  }

  function applyImpact(a, res) {
    if (res === 'parry') parry(a);
    else if (res === 'block') block(a);
    else if (res === 'mikiri') mikiri(a);
    else if (res === 'dodge') missPlayer(a, true);
    else if (res === 'stomp') stomp(a);
    else if (res === 'miss') missPlayer(a, false);
    else hitPlayer(a, res === 'guardBreak');
  }

  function parry(a) {
    a.resolved = true; a.parried = true;
    S.stats.parry++; addChain();
    const amt = CFG.brk.parry * a.move.w;
    S.B = clamp(S.B + amt, 0, 100); S.lastPressure = S.gt;
    Sound.parry('tai', S.chain);
    S.freezeUntil = performance.now() + 90; flash(0.18);
    tA.copy(enemy.tip).lerp(enemy.mid, 0.35);
    burst(tA, 32, 2.4, 'cool'); lightAt(tA, 4.2, 0xe6eeff);
    ring((S.e.x + S.p.x) / 2, (S.e.z + S.p.z) / 2, 2.8);
    glyphAt('弾き', 'tai', tA);
    S.fovKick = Math.max(S.fovKick, 4);
    if (S.pa && S.pa.kind === 'deflect') S.pa.snap = S.gt;
    S.counterUntil = S.gt + CFG.counterParry; S.counterKind = 'parry';
    S.stagger.vx += (S.r() < 0.5 ? -1 : 1) * 1.3 * a.move.w; S.stagger.vp -= 0.9 * a.move.w;
    const f = dirPE();
    tween(S.e, S.e.x + f.x * 0.35, S.e.z + f.z * 0.35, 220);
    pushLog('弾き', `${Math.round(a.T - S.guardStart)}ms`, `崩し ${Math.round(amt)}　反撃の機会`);
    // 連撃の最後か重い技を弾くと、相手は大きくよろめく
    if (!S.queue.length || a.move.w >= 1.4) { S.queue = []; S.action = null; setMode('staggered', 700); }
    if (S.B >= 100) breakEnemy();
  }

  function block(a) {
    a.resolved = true;
    S.stats.block++;
    S.P = clamp(S.P + CFG.blockDamage(a.move.w), 0, 100); S.lastHit = S.gt;
    S.B = clamp(S.B + CFG.brk.block, 0, 100);
    Sound.clash();
    tA.copy(enemy.tip).lerp(enemy.mid, 0.4); burst(tA, 10, 1.2, 'cool');
    glyphAt('受け', 'miss', tA);
    const f = dirPE();
    tween(S.p, S.p.x - f.x * 0.35, S.p.z - f.z * 0.35, 180);
    pushLog('受け', `${Math.round(a.T - S.guardStart)}ms`, '早すぎた。弾きは刃が届く直前');
    if (S.P >= 100) defeat();
  }

  function mikiri(a) {
    a.resolved = true; a.missed = true;
    S.stats.mikiri++; addChain();
    S.queue = [];
    Sound.parry('sen', S.chain); Sound.dodge();
    S.slowUntil = performance.now() + 950; S.slowScale = 0.3;
    flash(0.2, '#cfe0ff');
    glyphAt('見切り', 'sen', player.chestWorld);
    S.counterUntil = S.gt + CFG.counterMikiri; S.counterKind = 'mikiri';
    S.fovKick = Math.max(S.fovKick, 5);
    pushLog('見切り', `${Math.round(a.T - S.dodgeStart)}ms`, '反撃の機会');
  }

  function stomp(a) {
    a.resolved = true; S.queue = []; S.action = null;
    S.stats.stomp++; addChain();
    S.B = clamp(S.B + CFG.brk.stomp, 0, 100); S.lastPressure = S.gt;
    Sound.parry('sen', S.chain); Sound.clash();
    S.slowUntil = performance.now() + 420;
    tA.copy(enemy.tip).lerp(player.chestWorld, 0.5);
    burst(tA, 40, 2.6, 'warm'); lightAt(tA, 5, 0xffd2a0); ring(tA.x, tA.z, 3.4, 0xffd2a0);
    glyphAt('見切り踏み', 'sen', tA);
    S.counterUntil = S.gt + 1100; S.counterKind = 'mikiri';
    pushLog('踏み', '', `危険な突きを踏みつけた　崩し ${CFG.brk.stomp}`);
    if (S.B >= 100) breakEnemy(); else setMode('staggered', 1000);
  }

  function hitPlayer(a, guardBreak) {
    a.resolved = true;
    S.P = clamp(S.P + CFG.hitDamage(a.move.w) * (a.peril ? 1.3 : 1), 0, 100);
    S.lastHit = S.gt; S.stats.hits++;
    breakChain();
    Sound.hit();
    S.shake = 0.18;
    S.playerLockUntil = S.gt + 300;
    startPA('hit');
    flash(0.1, '#ff6a4a');
    tA.copy(player.chestWorld); burst(tA, 16, 1.6, 'red');
    const f = dirPE();
    tween(S.p, S.p.x - f.x * 0.6, S.p.z - f.z * 0.6, 200);
    if (guardBreak) glyphAt('崩', 'miss', player.chestWorld);
    pushLog('被弾', '', guardBreak ? `${a.move.name}は弾けない` : a.move.name);
    if (S.P >= 100) defeat();
  }

  function missPlayer(a, dodged) {
    a.resolved = true; a.missed = true;
    if (dodged) { S.stats.dodges++; glyphAt('避', 'go', player.chestWorld); pushLog('避け', `${Math.round(a.T - S.dodgeStart)}ms`, '見切りは刃が届く直前'); }
    else pushLog('届かず', '', `${a.move.name}は届かなかった`);
  }

  function breakChain() { if (S.chain >= 3) pushLog('連', '', `${S.chain}連が途切れた`); S.chain = 0; }
  function addChain() { S.chain++; S.bestChain = Math.max(S.bestChain, S.chain); if (S.chain >= 3) glyphAtScreen(`${S.chain} 連`, 'chain', 0.5, 0.26); }

  function breakEnemy() {
    S.queue = []; S.action = null;
    setMode('broken', CFG.brokenTime);
    pushLog('崩れ', '', '膝をついた。上で一閃');
  }

  function issen() {
    setMode('falling', S.phase === 1 ? 3200 : 2600);
    S.freezeUntil = performance.now() + 420;
    S.slowUntil = performance.now() + 1500; S.slowScale = 0.3;
    startPA('issen');
    Sound.issen();
    flash(0.6);
    const sl = document.getElementById('slash');
    sl.classList.remove('on'); void sl.offsetWidth; sl.classList.add('on');
    tA.copy(enemy.chestWorld);
    burst(tA, 60, 2.2, 'warm'); lightAt(tA, 6, 0xfff1dc);
    ring(S.e.x, S.e.z, 4.5);
    const f = dirPE();
    const far = camera.aspect < 1 ? 7.6 : 4.4;
    const cx = S.e.x + f.x * 0.8, cz = S.e.z + f.z * 0.8;
    S.cine = { until: S.gt + 1700, pos: V(cx - f.z * far, 1.3, cz + f.x * far), look: V(cx, 1.0, cz) };
    tween(S.p, S.e.x + f.x * 1.7, S.e.z + f.z * 1.7, 180);
    pushLog('一閃', '', S.phase === 1 ? '前半を制した' : '勝負あり');
  }

  function defeat() {
    S.queue = []; S.action = null;
    S.mode = 'defeat'; S.modeStart = S.gt;
    startPA('down');
    setTimeout(() => showEnd(false), 1300);
  }

  // ───────────────────────── 画面上の表現 ─────────────────────────
  const glyphs = document.getElementById('glyphs');
  const projV = V(0, 0, 0);
  function glyphAt(text, cls, world) {
    projV.copy(world).project(camera);
    glyphAtScreen(text, cls, (projV.x + 1) / 2, (1 - projV.y) / 2);
  }
  function glyphAtScreen(text, cls, nx, ny) {
    const el = document.createElement('div');
    el.className = `glyph ${cls}`;
    el.textContent = text;
    el.style.left = `${clamp(nx, 0.08, 0.92) * 100}%`;
    el.style.top = `${clamp(ny, 0.08, 0.92) * 100}%`;
    glyphs.appendChild(el);
    setTimeout(() => el.remove(), cls === 'phase' ? 2000 : 950);
  }
  const flashEl = document.getElementById('flash');
  function flash(strength, color) {
    flashEl.style.transition = 'none';
    flashEl.style.background = color || '#fff';
    flashEl.style.opacity = String(strength);
    void flashEl.offsetWidth;
    flashEl.style.transition = 'opacity 260ms ease-out';
    flashEl.style.opacity = '0';
  }

  const logEl = document.getElementById('log');
  const logBtn = document.getElementById('logBtn');
  function pushLog(t, e, d) {
    S.log.unshift({ t, e, d });
    S.log.length = Math.min(S.log.length, 8);
    renderLog();
  }
  function renderLog() {
    if (logEl.hidden) return;
    const h = S.habit;
    const learn = h.guard > 2 ? '　下の連打を読まれている' : h.attack > 2.5 ? '　斬りかかりを読まれている' : h.dodge > 2.5 ? '　避けを読まれている' : '';
    const meta = `${S.phase === 1 ? '前半' : '後半'}　相手の体幹 ${Math.round(S.B)}　自分 ${Math.round(S.P)}　間合い ${dist().toFixed(1)}m${S.gt < S.counterUntil ? '　反撃の機会' : ''}${learn}`;
    logEl.innerHTML = `<div class="meta">${meta}</div>` + S.log.map((r) => `<div class="row"><span class="t">${r.t}</span><span>${r.e}</span><span>${r.d}</span></div>`).join('');
  }
  logBtn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    logEl.hidden = !logEl.hidden;
    logBtn.setAttribute('aria-pressed', String(!logEl.hidden));
    renderLog();
  });

  // ───────────────────────── 入力 ─────────────────────────
  const FLICK_PX = 14;
  function eventTime(ev) {
    const n = performance.now(), t = ev.timeStamp;
    return (t > 0 && Math.abs(n - t) < 1000) ? t : n;
  }
  stage.addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    Sound.init();
    const touch = { x: ev.clientX, y: ev.clientY, tDown: toGameTime(eventTime(ev)), resolved: false };
    S.touch = touch;
    setTimeout(() => { if (!touch.resolved) touch.resolved = true; }, 240);
  });
  stage.addEventListener('pointermove', (ev) => {
    const tc = S.touch;
    if (!tc || tc.resolved) return;
    const dx = ev.clientX - tc.x, dy = ev.clientY - tc.y;
    if (dx * dx + dy * dy < FLICK_PX * FLICK_PX) return;
    tc.resolved = true;
    doInput(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'), tc.tDown);
  });
  const release = () => { if (S.touch) S.touch.resolved = true; };
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  window.addEventListener('keydown', (ev) => {
    if (ev.repeat || !S.started) return;
    const map = { ArrowRight: 'R', ArrowLeft: 'L', ArrowUp: 'U', ArrowDown: 'D' };
    if (!(ev.key in map)) return;
    ev.preventDefault();
    Sound.init();
    doInput(map[ev.key], toGameTime(eventTime(ev)));
  });

  // ───────────────────────── 相手の進行 ─────────────────────────
  function updateAI() {
    const gt = S.gt, m = S.mode, f = dirPE();
    if (m === 'stalk') {
      const pref = S.phase === 1 ? 3.6 : 3.2;
      const radial = clamp((f.d - pref) * 1.2, -0.9, 0.9);
      S.e.vx = (-f.z * S.stalkDir * 1.05 - f.x * radial);
      S.e.vz = (f.x * S.stalkDir * 1.05 - f.z * radial);
      if (gt >= S.modeUntil) { S.e.vx = S.e.vz = 0; think(); }
    } else if (m === 'approach') {
      const sp = S.phase === 1 ? 1.7 : 2.1;
      S.e.vx = -f.x * sp; S.e.vz = -f.z * sp;
      if (f.d <= 2.75 || gt >= S.modeUntil) { S.e.vx = S.e.vz = 0; think(); }
    } else { S.e.vx = 0; S.e.vz = 0; }

    if ((m === 'open' || m === 'bait') && gt >= S.modeUntil) afterOpening();
    if (m === 'retreatStart') { tween(S.e, S.e.x + f.x * 1.6, S.e.z + f.z * 1.6, 380); kickSnow(enemy.hipWorld, 0.5); setMode('retreat', 420); }
    if (m === 'retreat' && gt >= S.modeUntil) setMode('stalk', 500 + S.r() * 700);
    if (m === 'staggered' && gt >= S.modeUntil) { if (S.r() < 0.35) setMode('retreatStart', 0); else setMode('stalk', 300 + S.r() * 300); }
    if (m === 'broken' && gt >= S.modeUntil) { S.B = 62; setMode('retreatStart', 0); pushLog('立ち直り', '', '一閃の機会を逃した'); }
    if (m === 'falling' && gt >= S.modeUntil) {
      if (S.phase === 1) {
        S.phase = 2; S.B = 0; S.P = Math.max(0, S.P - 40);
        enemy.bladeMat.emissive.set(0x3a0c10);
        setMode('stalk', 1200); S.queue = [];
        glyphAtScreen('弐', 'phase', 0.5, 0.42);
        Sound.phase();
        pushLog('後半', '', '相手が立ち上がった');
      } else {
        S.mode = 'victory';
        setTimeout(() => showEnd(true), 900);
      }
    }

    const a = S.action;
    if (S.mode === 'attack' && a) {
      if (a.feint) {
        if (gt >= a.end) { S.action = null; if (S.queue.length) startAction(S.queue.shift()); else setMode('stalk', 500); }
        return;
      }
      if (!a.lunged && gt >= a.T - a.S) {
        a.lunged = true;
        Sound.swing(a.move.w);
        if (a.move.dash) {
          const go = Math.max(0, f.d - 1.8);
          tween(S.e, S.e.x - f.x * go, S.e.z - f.z * go, a.S, easeIn);
          kickSnow(enemy.hipWorld, 1.2);
        } else {
          const go = Math.min(a.move.lunge, Math.max(0, f.d - CFG.minGap - 0.1));
          tween(S.e, S.e.x - f.x * go, S.e.z - f.z * go, a.S + 60, easeOut);
        }
      }
      if (!a.resolved && gt >= a.T) {
        const res = judgeImpact(a);
        if (res) applyImpact(a, res);
      }
      const end = a.T + a.F + a.R;
      if (S.mode === 'attack' && S.action === a) {
        if (S.queue.length && gt >= a.T + a.F * 0.9) startAction(S.queue.shift());
        else if (gt >= end) { S.action = null; afterPattern(a); }
      }
    }
  }
  function afterPattern(a) {
    const baitChance = S.phase === 2 ? clamp(0.2 + S.habit.attack * 0.06, 0, 0.5) : 0;
    if (S.r() < baitChance) setMode('bait', 650 + S.r() * 300);
    else setMode('open', a && a.missed ? 1000 : 560 + S.r() * 220);
  }
  function afterOpening() {
    if (S.mode === 'bait' && S.r() < 0.6) { startAction(S.r() < 0.5 ? 'counterR' : 'counterL'); return; }
    if (S.r() < 0.3) setMode('retreatStart', 0); else setMode('stalk', 500 + S.r() * 800);
  }

  // ───────────────────────── 位置 ─────────────────────────
  function updateActor(actor, dt) {
    if (actor.tw) {
      const tw = actor.tw;
      const u = clamp((S.gt - tw.t0) / tw.dur, 0, 1);
      const k = tw.easing(u);
      actor.x = lerp(tw.fx, tw.tx, k); actor.z = lerp(tw.fz, tw.tz, k);
      if (u >= 1) actor.tw = null;
    } else if (actor.vx !== undefined) {
      actor.x += actor.vx * dt; actor.z += actor.vz * dt;
    }
  }
  function updatePositions(dtGame) {
    const dt = dtGame / 1000;
    updateActor(S.e, dt);
    updateActor(S.p, dt);
    // 重ならない
    const dx = S.e.x - S.p.x, dz = S.e.z - S.p.z, d = Math.hypot(dx, dz);
    if (d < CFG.minGap && S.mode !== 'falling') {
      const push = (CFG.minGap - d) / 2, nx = dx / (d || 1), nz = dz / (d || 1);
      S.e.x += nx * push; S.e.z += nz * push; S.p.x -= nx * push; S.p.z -= nz * push;
    }
    // 石灯籠の輪の内側に留まる
    [S.e, S.p].forEach((a) => {
      const r = Math.hypot(a.x, a.z);
      if (r > CFG.arena) { a.x *= CFG.arena / r; a.z *= CFG.arena / r; }
    });
    S.e.yaw = Math.atan2(S.p.x - S.e.x, S.p.z - S.e.z);
    if (S.mode !== 'falling' || !S.cine) S.p.yaw = Math.atan2(S.e.x - S.p.x, S.e.z - S.p.z);
  }

  // ───────────────────────── 姿勢 ─────────────────────────
  const breathPeriod = (load) => lerp(2400, 900, clamp(load / 100, 0, 1));
  const P_TMP = clonePose(NEUTRAL), P_BASE = clonePose(PL.guard);
  function enemyPoseNow() {
    const gt = S.gt, out = S.enemyPose, a = S.action, m = S.mode;
    const since = gt - S.modeStart;
    if (m === 'attack' && a) {
      const K = KEY[a.move.key] || KEY.D;
      const t = gt - a.t0;
      if (a.feint) {
        // 虚：腕と刀だけが動き、腰は動かない
        if (t <= a.O) blendSplit(S.actionFrom, K.wind, smooth(t / a.O) * 0.08, smooth(t / a.O) * 0.5, out);
        else { blendSplit(S.actionFrom, K.wind, 0.08, 0.5, P_TMP); blend(P_TMP, NEUTRAL, smooth((t - a.O) / 320), out); }
      } else if (t <= a.O) {
        // 本物の起こり：腰が先に動き、腕は少し遅れる
        const u = smooth(t / a.O);
        blendSplit(S.actionFrom, K.wind, u, u * 0.25, out);
      } else if (t <= a.O + a.W) {
        blendSplit(S.actionFrom, K.wind, 1, 0.25 + 0.75 * smooth((t - a.O) / a.W), out);
      } else if (t <= a.O + a.W + a.D) {
        blend(K.wind, K.wind, 0, out);
        out.hand.x += Math.sin(gt * 0.09) * 0.006; out.hand.y += Math.sin(gt * 0.13) * 0.006;
      } else if (gt <= a.T) {
        // 振り：腰と胴が先に回り、腕と刀が後から追いつく
        const u = (gt - (a.T - a.S)) / a.S;
        blendSplit(K.wind, K.hit, easeOut(clamp(u * 1.35, 0, 1)), easeIn(u), out);
      } else if (gt <= a.T + a.F) {
        const u = (gt - a.T) / a.F;
        blendSplit(K.hit, K.follow, easeOut(clamp(u * 1.2, 0, 1)), easeOut(u), out);
      } else {
        blend(K.follow, NEUTRAL, smooth((gt - a.T - a.F) / a.R), out);
      }
    } else if (m === 'open') blend(S.actionFrom, OPEN, smooth(since / 220), out);
    else if (m === 'bait') blend(S.actionFrom, BAIT, smooth(since / 220), out);
    else if (m === 'broken') blend(S.actionFrom, KNEEL, easeOut(since / 380), out);
    else if (m === 'falling') {
      blend(S.actionFrom, KNEEL, easeOut(since / 300), out);
      if (S.phase === 2) { out.pitch += smooth((since - 300) / 1400) * 0.9; out.crouch += smooth((since - 300) / 1400) * 0.25; }
    } else if (m === 'victory') { blend(KNEEL, KNEEL, 0, out); out.pitch += 0.9; out.crouch += 0.25; }
    else {
      blend(S.actionFrom, NEUTRAL, smooth(since / 420), out);
      if (m === 'stalk' || m === 'approach') { out.crouch += 0.03 + Math.abs(Math.sin(gt * 0.011)) * 0.025; out.roll += S.stalkDir * 0.05 * (m === 'stalk' ? 1 : 0); }
    }
    if (gt < S.guardUntil) blend(out, GUARD, 0.85, out);
    const load = S.B / 100;
    if (m !== 'falling' && m !== 'victory') {
      out.crouch += 0.012 * Math.sin(gt / breathPeriod(S.B) * Math.PI * 2) + load * 0.1;
      out.roll += Math.sin(gt * 0.0031) * load * 0.07;
      out.hand.y -= load * 0.12;
      out.hand.x += Math.sin(gt * 0.047) * load * load * 0.02;
    }
    out.hipX += S.stagger.x * 0.35; out.yaw += -S.stagger.x * 0.6; out.pitch += S.stagger.p * 0.35; out.hand.x += S.stagger.x * 0.4;
    return out;
  }

  function playerPoseNow() {
    const out = S.playerPose, pa = S.pa;
    // 相手が近いほど、構えが低く締まる
    blend(PL.guard, PL.low, clamp((3.6 - dist()) / 1.8, 0, 1) * 0.6, P_BASE);
    if (pa) {
      const t = S.gt - pa.t0, keys = pa.def.keys;
      let prev = pa.from, prevT = 0, done = false;
      for (let i = 0; i < keys.length; i++) {
        const [kt, name, e] = keys[i];
        const target = name === 'guard' ? P_BASE : PL[name];
        if (t <= kt) { blend(prev, target, (e || smooth)(clamp((t - prevT) / Math.max(1, kt - prevT), 0, 1)), out); done = true; break; }
        prev = target; prevT = kt;
      }
      if (!done) blend(prev, prev, 0, out);
      if (pa.kind === 'deflect' && pa.snap) {
        const u = S.gt - pa.snap;
        blend(out, PL.deflectSnap, clamp(u < 60 ? easeOut(u / 60) : 1 - smooth((u - 60) / 280), 0, 1), out);
      }
      if (pa.kind === 'dodge') { out.roll += -(pa.side || 1) * 0.0; }
    } else blend(P_BASE, P_BASE, 0, out);
    const load = S.P / 100;
    out.crouch += 0.01 * Math.sin(S.gt / breathPeriod(S.P) * Math.PI * 2) + load * 0.08;
    out.roll += Math.sin(S.gt * 0.0027) * load * 0.06;
    out.hand.y -= load * 0.1;
    return out;
  }

  function updateBodies(dtGame) {
    if (!['broken', 'falling', 'victory'].includes(S.mode) && S.gt - S.lastPressure > CFG.enemyRecoverDelay) S.B = Math.max(0, S.B - CFG.enemyRecoverRate * dtGame / 1000);
    if (S.mode !== 'defeat' && S.gt - S.lastHit > CFG.playerRecoverDelay) S.P = Math.max(0, S.P - CFG.playerRecoverRate * dtGame / 1000);
    const k = 38, dmp = 9, dt = Math.min(dtGame, 50) / 1000;
    S.stagger.vx += (-k * S.stagger.x - dmp * S.stagger.vx) * dt; S.stagger.x += S.stagger.vx * dt;
    S.stagger.vp += (-k * S.stagger.p - dmp * S.stagger.vp) * dt; S.stagger.p += S.stagger.vp * dt;
    const act = S.action;
    const eFast = S.mode === 'attack' && act && !act.feint && S.gt >= act.T - act.S - 40 && S.gt <= act.T + act.F;
    const pa = S.pa;
    const pFast = pa && ['slash1', 'slash2', 'slash3', 'counter', 'deflect', 'stomp', 'hit', 'issen', 'dodge'].includes(pa.kind) && S.gt - pa.t0 < 320;
    enemy.apply(enemyPoseNow(), S.e.x, S.e.z, S.e.yaw, dtGame, (at, landing) => { Sound.step(landing ? 1 : 0.5); if (landing) kickSnow(at, 0.6); }, { fast: eFast, look: player.headWorld });
    player.apply(playerPoseNow(), S.p.x, S.p.z, S.p.yaw, dtGame, (at, landing) => { if (landing) { Sound.step(1); kickSnow(at, 0.7); } }, { fast: pFast, look: enemy.headWorld });
    const ep = breathPeriod(S.B), pp = breathPeriod(S.P);
    const eb = Math.floor(S.gt / ep), pb = Math.floor(S.gt / pp);
    if (eb !== S.breathE) { S.breathE = eb; if (S.mode !== 'victory' && !(S.mode === 'falling' && S.phase === 2)) { exhale(enemy.headWorld, enemy.fwd, S.B / 100); if (S.B > 55) Sound.breath(S.B / 100); } }
    if (pb !== S.breathP) { S.breathP = pb; exhale(player.headWorld, player.fwd, S.P / 100); }
  }

  function updateEffects(dtReal) {
    const dt = dtReal / 1000, now = performance.now();
    for (let i = 0; i < SPARK_N; i++) {
      const s = sparkState[i];
      if (s.life > 0) {
        s.life -= dt; s.v.y -= 6 * dt; s.p.addScaledVector(s.v, dt);
        const f = Math.max(0, s.life / s.max);
        sparkCol[i * 3] = s.c.r * f; sparkCol[i * 3 + 1] = s.c.g * f; sparkCol[i * 3 + 2] = s.c.b * f;
      } else { sparkCol[i * 3] = sparkCol[i * 3 + 1] = sparkCol[i * 3 + 2] = 0; }
      sparkPos[i * 3] = s.p.x; sparkPos[i * 3 + 1] = s.p.y; sparkPos[i * 3 + 2] = s.p.z;
    }
    sparkGeo.attributes.position.needsUpdate = true; sparkGeo.attributes.color.needsUpdate = true;
    for (const b of puffs) {
      if (!b.m.visible) continue;
      b.life -= dt;
      if (b.life <= 0) { b.m.visible = false; continue; }
      const u = 1 - b.life / b.max;
      b.v.y -= b.grav * dt;
      b.m.position.addScaledVector(b.v, dt);
      if (b.m.position.y < 0.02) b.m.position.y = 0.02;
      b.v.multiplyScalar(1 - 0.9 * dt);
      const sz = b.size * (0.6 + u * 1.6);
      b.m.scale.set(sz, sz, 1);
      b.m.material.opacity = b.peak * Math.sin(Math.min(1, u * 1.4) * Math.PI) * (1 - u * 0.4);
    }
    for (const r of rings) {
      if (!r.m.visible) continue;
      const u = (now - r.t0) / 520;
      if (u >= 1) { r.m.visible = false; continue; }
      const s = r.size * easeOut(u);
      r.m.scale.set(s, s, 1);
      r.m.material.opacity = 0.75 * (1 - u);
    }
    for (const p of prints) {
      if (!p.m.visible) continue;
      const age = (now - p.born) / 1000;
      p.m.material.opacity = age < 0.2 ? age / 0.2 * 0.8 : Math.max(0, 0.8 - (age - 0.2) / 30);
      if (age > 31) p.m.visible = false;
    }
    for (let i = 0; i < SNOW_N; i++) {
      snowPos[i * 3 + 1] -= dt * (0.35 + (i % 7) * 0.04);
      snowPos[i * 3] += Math.sin(now * 0.0004 + i) * dt * 0.08;
      if (snowPos[i * 3 + 1] < 0) snowPos[i * 3 + 1] += 8;
    }
    snowGeo.attributes.position.needsUpdate = true;
    const a = S.action;
    enemyTrail.color = a && a.peril ? { r: 1, g: 0.35, b: 0.32 } : { r: 0.78, g: 0.84, b: 0.98 };
    enemyTrail.update(a && !a.feint && S.mode === 'attack' && S.gt >= a.T - a.S - 30 && S.gt <= a.T + a.F, enemy, now);
    const pa = S.pa;
    playerTrail.update(pa && ['slash1', 'slash2', 'slash3', 'counter', 'deflect', 'stomp', 'issen'].includes(pa.kind) && S.gt - pa.t0 < (pa.def.hitAt || 120) + 160, player, now);
    // 危険な技の赤い光：起こりから振り始めまで
    const perilOn = a && a.peril && S.mode === 'attack' && S.gt < a.T - a.S;
    glint.material.opacity = perilOn ? 0.55 + Math.sin(now * 0.03) * 0.25 : Math.max(0, glint.material.opacity - dt * 4);
    glint.position.copy(enemy.tip);
    enemy.bladeMat.emissive.set(perilOn ? 0x7a1010 : (S.phase === 2 ? 0x3a0c10 : 0x1a2230));
    const lt = (clashLightUntil - now) / 220;
    clashLight.intensity = lt > 0 ? clashLightPeak * lt : 0;
    lanternLights.forEach((l, i) => { l.intensity = 1.25 + Math.sin(now * 0.007 + i) * 0.08 + Math.sin(now * 0.0173 + i * 2) * 0.05; });
  }

  // ───────────────────────── カメラ ─────────────────────────
  const camPos = V(0, 2.4, 5), camLook = V(0, 1, 0), camPosT = V(0, 0, 0), camLookT = V(0, 0, 0);
  let camInit = false;
  function updateCamera(dtReal) {
    const dt = dtReal / 1000;
    const f = dirPE();
    if (S.cine && S.gt < S.cine.until) {
      camPosT.copy(S.cine.pos); camLookT.copy(S.cine.look);
    } else {
      S.cine = null;
      // 自分の背中の右肩越しに、相手を見る。離れるほど引く。
      const back = 4.3 + Math.max(0, f.d - 3) * 0.4;
      const rx = -f.z, rz = f.x;
      camPosT.set(S.p.x - f.x * back + rx * 1.05, 3.2 + Math.max(0, f.d - 3) * 0.18, S.p.z - f.z * back + rz * 1.05);
      camLookT.set(S.p.x + f.x * f.d * 0.62, 1.15, S.p.z + f.z * f.d * 0.62);
    }
    if (!camInit || (S.cine && !S.cine.cut)) { camPos.copy(camPosT); camLook.copy(camLookT); camInit = true; if (S.cine) S.cine.cut = true; }
    const k = 1 - Math.exp(-dt * (S.cine ? 9 : 5));
    camPos.lerp(camPosT, k); camLook.lerp(camLookT, k);
    S.shake = Math.max(0, S.shake - dt * 0.5);
    const t = performance.now();
    camera.position.set(camPos.x + Math.sin(t * 0.091) * S.shake, camPos.y + Math.sin(t * 0.077) * S.shake * 0.7, camPos.z + Math.cos(t * 0.083) * S.shake * 0.5);
    camera.lookAt(camLook);
    S.fovKick = Math.max(0, S.fovKick - dt * 18);
    const base = camera.aspect < 1 ? 54 : 40;
    const fov = base - S.fovKick;
    if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
  }
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ───────────────────────── 自動で遊ぶ（試験用） ─────────────────────────
  function autoPlay() {
    if (!S.auto) return;
    const fire = (dir) => doInput(dir, S.gt);
    if (S.mode === 'broken' && S.gt > S.modeStart + 250) { fire('U'); return; }
    if (S.gt < S.counterUntil && !S.autoCountered && (!S.pa || ['deflect', 'dodge', 'stomp'].includes(S.pa.kind))) { S.autoCountered = true; fire('U'); return; }
    if (S.gt >= S.counterUntil) S.autoCountered = false;
    const a = S.action;
    if ((S.mode === 'open' || S.mode === 'staggered') && dist() < CFG.reachPlayer && (!S.pa || S.gt - S.pa.t0 > (S.pa.def.cancel || S.pa.def.dur))) {
      if (!S.autoCutAt || S.gt - S.autoCutAt > 250) { S.autoCutAt = S.gt; fire('U'); }
      return;
    }
    if (!a || a.resolved || a.feint || a.autoDone) return;
    if (a.peril === 'sweep') { if (S.gt >= a.T - 90) { a.autoDone = true; fire('R'); } return; }
    if (a.peril === 'pierce') { if (S.gt >= a.T - 140) { a.autoDone = true; fire('U'); } return; }
    if (S.auto === 'debana' && a.move.w >= 1.4 && S.gt >= a.t0 + a.O * 0.4) { a.autoDone = true; fire('U'); return; }
    if (S.gt >= a.T - 70) { a.autoDone = true; fire('D'); }
  }

  // ───────────────────────── ループ ─────────────────────────
  let last = performance.now();
  function frame(now) {
    const dtReal = Math.min(64, now - last);
    last = now;
    let scale = 1;
    if (now < S.freezeUntil) scale = 0;
    else if (now < S.slowUntil) scale = S.slowScale;
    const dtGame = S.started ? dtReal * scale * S.speed : 0;
    if (S.started) {
      S.gt += dtGame;
      S.frameGt = S.gt; S.frameReal = now; S.frameScale = scale;
      autoPlay();
      updatePlayerAction();
      updateAI();
      updatePositions(dtGame);
    }
    updateBodies(dtGame);
    updateEffects(dtReal * (scale === 0 ? 0.15 : scale));
    updateCamera(dtReal);
    renderer.render(scene, camera);
    if (!logEl.hidden && (now | 0) % 6 === 0) renderLog();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ───────────────────────── 開始と終了 ─────────────────────────
  const startEl = document.getElementById('start');
  const endEl = document.getElementById('end');
  const hintEl = document.getElementById('hint');
  let hintTimer = 0;
  function showHint() {
    hintEl.classList.remove('fade'); hintEl.hidden = false;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hintEl.classList.add('fade'), 9000);
  }
  function begin(fromPhase) {
    Object.assign(S, {
      started: true, phase: fromPhase, B: 0, P: 0, action: null, queue: [], pa: null, bufferU: false, comboStep: 0,
      guardStart: -1e9, lastGuard: -1e9, dodgeStart: -1e9, stompStart: -1e9, counterUntil: 0, playerLockUntil: 0,
      guardUntil: 0, enemyDeflects: 0, lastPressure: S.gt, lastHit: -9999, chain: 0, cine: null, slowScale: 0.3,
      habit: { guard: 0, attack: 0, dodge: 0 },
    });
    S.e.x = 0; S.e.z = -2.4; S.e.tw = null; S.p.x = 0; S.p.z = 2.1; S.p.tw = null;
    enemy.resetFeet(); player.resetFeet();
    enemy.bladeMat.emissive.set(fromPhase === 2 ? 0x3a0c10 : 0x1a2230);
    S.r = rng((Date.now() ^ (fromPhase * 7919)) >>> 0);
    setMode('stalk', 1800);
    S.stats = { parry: 0, block: 0, mikiri: 0, counter: 0, debana: 0, stomp: 0, cut: 0, hits: 0, dodges: 0, start: S.gt };
    S.bestChain = 0;
    S.log = []; renderLog();
    showHint();
  }
  document.getElementById('startBtn').addEventListener('click', () => { Sound.init(); startEl.hidden = true; begin(1); });
  function showEnd(won) {
    const st = S.stats;
    const secs = Math.round((S.gt - st.start) / 1000);
    document.getElementById('endTitle').textContent = won ? '勝負あり' : '倒れた';
    document.getElementById('endText').textContent = won
      ? `${secs}秒。弾き ${st.parry}・見切り ${st.mikiri}・反撃 ${st.counter}・出鼻 ${st.debana}・踏み ${st.stomp}・斬り ${st.cut}・被弾 ${st.hits}・最高 ${S.bestChain}連`
      : `${S.phase === 1 ? '前半' : '後半'}から、すぐにやり直せます。`;
    document.getElementById('againBtn').textContent = won ? 'もう一度' : 'やり直す';
    endEl.hidden = false;
    S.lastWon = won;
  }
  document.getElementById('againBtn').addEventListener('click', () => { endEl.hidden = true; begin(S.lastWon ? 1 : S.phase); });

  window.__kaeshi = {
    get state() { return { mode: S.mode, phase: S.phase, B: S.B, P: S.P, gt: S.gt, d: dist(), chain: S.chain, pa: S.pa && S.pa.kind, counter: S.gt < S.counterUntil, stats: { ...S.stats }, action: S.action && { name: S.action.move.name, feint: S.action.feint, peril: S.action.peril, T: S.action.T, t0: S.action.t0, O: S.action.O } }; },
    setSpeed(v) { S.speed = v; },
    setAuto(v) { S.auto = v; },
    force(token) { S.queue = []; S.action = null; startAction(token); },
    forceMode(m, dur) { S.action = null; S.queue = []; S.counterUntil = 0; S.P = 0; setMode(m, dur); },
    input(dir) { doInput(dir, S.gt); },
  };
})();
</script>

</body>
